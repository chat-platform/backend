name: Deploy backend to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-backend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      IMAGE_TAG: ${{ github.sha }}
      EC2_HOST: ${{ vars.EC2_HOST }}
      DEPLOY_DIRECTORY: ${{ vars.BACKEND_DEPLOY_DIRECTORY }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MEDIA_S3_ENDPOINT: ${{ vars.MEDIA_S3_ENDPOINT }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION }}
          MEDIA_S3_BUCKET: ${{ vars.MEDIA_S3_BUCKET }}
          MEDIA_S3_ACCESS_KEY: ${{ secrets.MEDIA_S3_ACCESS_KEY }}
          MEDIA_S3_SECRET_KEY: ${{ secrets.MEDIA_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          for name in EC2_HOST DEPLOY_DIRECTORY DOCKERHUB_USERNAME SSH_PRIVATE_KEY SSH_KNOWN_HOSTS FIREBASE_SERVICE_ACCOUNT_JSON MEDIA_S3_ENDPOINT MEDIA_S3_REGION MEDIA_S3_BUCKET MEDIA_S3_ACCESS_KEY MEDIA_S3_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Environment setting: $name" >&2
              exit 1
            fi
          done
          case "$DEPLOY_DIRECTORY" in
            /*) ;;
            *) echo "BACKEND_DEPLOY_DIRECTORY must be an absolute path" >&2; exit 1 ;;
          esac
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | python3 -c 'import json, sys; json.load(sys.stdin)'

      - name: Prepare S3 Compose overrides
        env:
          MEDIA_S3_ENDPOINT: ${{ vars.MEDIA_S3_ENDPOINT }}
          MEDIA_S3_REGION: ${{ vars.MEDIA_S3_REGION }}
          MEDIA_S3_BUCKET: ${{ vars.MEDIA_S3_BUCKET }}
          MEDIA_S3_ACCESS_KEY: ${{ secrets.MEDIA_S3_ACCESS_KEY }}
          MEDIA_S3_SECRET_KEY: ${{ secrets.MEDIA_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          names = (
              "MEDIA_S3_ENDPOINT", "MEDIA_S3_REGION", "MEDIA_S3_BUCKET",
              "MEDIA_S3_ACCESS_KEY", "MEDIA_S3_SECRET_KEY",
          )
          with open("github-s3.env", "w") as env_file:
              for name in names:
                  env_file.write(f"{name}={json.dumps(os.environ[name])}\n")
          os.chmod("github-s3.env", 0o600)
          PY

      - name: Package Compose runtime files
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          tar -czf deploy-bundle/backend-runtime.tar.gz \
            docker-compose.yml config scripts/postgres-init.sh \
            shared/migrations shared/seeds

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer deployment bundle
        run: |
          set -euo pipefail
          ssh "$EC2_HOST" "mkdir -p '$DEPLOY_DIRECTORY/.incoming'"
          scp deploy-bundle/backend-runtime.tar.gz \
            "$EC2_HOST:$DEPLOY_DIRECTORY/.incoming/"
          scp github-s3.env "$EC2_HOST:$DEPLOY_DIRECTORY/.incoming/github-s3.env"

      - name: Install Firebase credentials on EC2
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | ssh "$EC2_HOST" \
            "set -eu; mkdir -p '$DEPLOY_DIRECTORY/.secrets'; chmod 700 '$DEPLOY_DIRECTORY/.secrets'; cat > '$DEPLOY_DIRECTORY/.secrets/firebase-service-account.json'; chmod 600 '$DEPLOY_DIRECTORY/.secrets/firebase-service-account.json'"

      - name: Pull images and restart Compose services
        run: |
          set -euo pipefail
          ssh "$EC2_HOST" "DEPLOY_DIRECTORY='$DEPLOY_DIRECTORY' IMAGE_TAG='$IMAGE_TAG' DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIRECTORY"
          tar -xzf .incoming/backend-runtime.tar.gz
          export GOOGLE_APPLICATION_CREDENTIALS="$DEPLOY_DIRECTORY/.secrets/firebase-service-account.json"
          export IMAGE_TAG DOCKERHUB_USERNAME
          docker compose --env-file .env --env-file .incoming/github-s3.env -p messenger pull
          docker compose --env-file .env --env-file .incoming/github-s3.env -p messenger up -d --no-build --remove-orphans
          docker compose --env-file .env --env-file .incoming/github-s3.env -p messenger ps
          rm -rf .incoming
          REMOTE
