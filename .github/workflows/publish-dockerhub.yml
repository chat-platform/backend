name: Publish backend images to Docker Hub

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-backend-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: EC2-Deployment
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4

      - name: Validate Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in the EC2-Deployment environment." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'abdulrahimom' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish backend images
        run: |
          set -euo pipefail
          for service in core-api message-service ws-gateway relay notification-service; do
            docker buildx build \
              --platform linux/amd64 \
              --file services/Dockerfile \
              --build-arg "SERVICE=$service" \
              --tag "$DOCKERHUB_USERNAME/messenger-$service:$IMAGE_TAG" \
              --tag "$DOCKERHUB_USERNAME/messenger-$service:latest" \
              --push .
          done
