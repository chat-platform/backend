global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: message-service
    static_configs:
      - targets: ["message-service:9092"]
        labels:
          service: message-service

  - job_name: relay
    static_configs:
      - targets: ["relay:9093"]
        labels:
          service: relay
