apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: messenger
spec:
  rules:
    - host: messenger.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: core-api, port: {number: 8081}}}
          - path: /ws
            pathType: Prefix
            backend: {service: {name: ws-gateway, port: {number: 8080}}}
