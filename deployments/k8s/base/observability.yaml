apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  clusterIP: None
  selector: {app: prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  clusterIP: None
  selector: {app: grafana}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
spec:
  serviceName: grafana
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.4
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: PROMETHEUS_URL, value: "http://prometheus:9090"}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: grafana-auth, key: username}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-auth, key: password}}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true}
            - {name: data, mountPath: /var/lib/grafana}
          readinessProbe: {httpGet: {path: /api/health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumes:
        - name: provisioning
          configMap: {name: grafana-provisioning, items: [{key: grafana-dashboard-provider.yml, path: dashboards.yml}]}
        - name: datasource
          configMap: {name: grafana-provisioning, items: [{key: grafana-datasource.yml, path: datasource.yml}]}
        - name: dashboards
          configMap: {name: grafana-dashboard}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
