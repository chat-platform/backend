global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: core-api
    static_configs: [{targets: ["core-api:9091"]}]
  - job_name: message-service
    static_configs: [{targets: ["message-service:9092"]}]
  - job_name: relay
    static_configs: [{targets: ["relay:9093"]}]
  - job_name: ws-gateway
    static_configs: [{targets: ["ws-gateway:9094"]}]
  - job_name: notification-service
    static_configs: [{targets: ["notification-service:9095"]}]
