apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: {app: notification-service}
  ports: [{name: metrics, port: 9095, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector: {matchLabels: {app: notification-service}}
  template:
    metadata: {labels: {app: notification-service}}
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          command: ["sh", "-ec"]
          args:
            - |
              until [ "$(psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) = 3 FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('users','device','direct_outbox')" 2>/dev/null || true)" = "t" ]; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-auth, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-auth, key: database}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
      containers:
        - name: notification-service
          image: messenger-notification-service:local
          ports: [{name: metrics, containerPort: 9095}]
          envFrom: [{configMapRef: {name: backend-config}}]
          env:
            - {name: METRICS_ADDR, value: ":9095"}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-auth, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-auth, key: database}}
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom: {secretKeyRef: {name: firebase-config, key: project-id, optional: true}}
          volumeMounts:
            - {name: firebase, mountPath: /var/run/firebase, readOnly: true}
          readinessProbe: {tcpSocket: {port: metrics}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
      volumes:
        - name: firebase
          secret: {secretName: firebase-service-account}
