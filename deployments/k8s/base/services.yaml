apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
spec:
  selector: {app: ws-gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: metrics, port: 9094, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
spec:
  replicas: 1
  selector: {matchLabels: {app: ws-gateway}}
  template:
    metadata: {labels: {app: ws-gateway}}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: ws-gateway
          image: messenger-ws-gateway:local
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9094}
          envFrom: [{configMapRef: {name: backend-config}}]
          env:
            - {name: LISTEN_ADDR, value: ":8080"}
            - {name: METRICS_ADDR, value: ":9094"}
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: backend-secrets, key: jwt-secret}}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
