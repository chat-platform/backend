apiVersion: v1
kind: Service
metadata:
  name: core-api
spec:
  selector: {app: core-api}
  ports:
    - {name: http, port: 8081, targetPort: http}
    - {name: grpc, port: 50052, targetPort: grpc}
    - {name: metrics, port: 9091, targetPort: metrics}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
spec:
  replicas: 1
  selector: {matchLabels: {app: core-api}}
  template:
    metadata: {labels: {app: core-api}}
    spec:
      initContainers:
        - name: wait-for-schema
          image: postgres:16-alpine
          command: ["sh", "-ec"]
          args:
            - |
              until [ "$(psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT count(*) = 3 FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('users','device','direct_outbox')" 2>/dev/null || true)" = "t" ]; do sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-auth, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-auth, key: database}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
      containers:
        - name: core-api
          image: messenger-core-api:local
          ports:
            - {name: http, containerPort: 8081}
            - {name: grpc, containerPort: 50052}
            - {name: metrics, containerPort: 9091}
          envFrom: [{configMapRef: {name: backend-config}}]
          env:
            - {name: METRICS_ADDR, value: ":9091"}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-auth, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-auth, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-auth, key: database}}
            - name: POSTGRES_DSN
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: backend-secrets, key: jwt-secret}}
            - name: DEV_OTP_CODE
              valueFrom: {secretKeyRef: {name: backend-secrets, key: dev-otp-code}}
            - name: MEDIA_S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: backend-secrets, key: media-access-key}}
            - name: MEDIA_S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: backend-secrets, key: media-secret-key}}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
---
