services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger}
      POSTGRES_DB: ${POSTGRES_DB:-messenger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./shared/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  message-service:
    image: ${DOCKERHUB_USERNAME:-local}/messenger-message-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: message-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      GRPC_ADDR: ${MESSAGE_SERVICE_GRPC_ADDR:-:50051}
      METRICS_ADDR: ${MESSAGE_SERVICE_METRICS_ADDR:-:9092}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9096:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      message-service:
        condition: service_started
      relay:
        condition: service_started
      ws-gateway:
        condition: service_started
      notification-service:
        condition: service_started
      core-api:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  core-api:
    image: ${DOCKERHUB_USERNAME:-local}/messenger-core-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: core-api
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      LISTEN_ADDR: ${CORE_API_LISTEN_ADDR:-:8081}
      GRPC_ADDR: ${CORE_API_GRPC_ADDR:-:50052}
      METRICS_ADDR: ${CORE_API_METRICS_ADDR:-:9091}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-000000}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment-000000}
      SESSION_TTL: ${SESSION_TTL:-24h}
      MEDIA_URL_TTL: ${MEDIA_URL_TTL:-5m}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
    ports:
      - "${CORE_API_HOST_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws-gateway:
    image: ${DOCKERHUB_USERNAME:-local}/messenger-ws-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: ws-gateway
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      LISTEN_ADDR: ${WS_GATEWAY_LISTEN_ADDR:-:8080}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      MESSAGE_SERVICE_ADDR: ${MESSAGE_SERVICE_ADDR:-message-service:50051}
      CORE_API_GRPC_ADDR: ${WS_CORE_API_GRPC_ADDR:-core-api:50052}
      NODE_ID: ${NODE_ID:-ws-1}
      WS_PATH: ${WS_PATH:-/ws}
      METRICS_ADDR: ${WS_GATEWAY_METRICS_ADDR:-:9094}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment-000000}
    ports:
      - "${WS_GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      message-service:
        condition: service_started
      core-api:
        condition: service_started
      redis:
        condition: service_healthy

  relay:
    image: ${DOCKERHUB_USERNAME:-local}/messenger-relay:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: relay
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      RELAY_POLL_INTERVAL: ${RELAY_POLL_INTERVAL:-250ms}
      METRICS_ADDR: ${RELAY_METRICS_ADDR:-:9093}
      RELAY_BATCH_SIZE: ${RELAY_BATCH_SIZE:-100}
      RELAY_WORKERS: ${RELAY_WORKERS:-2}
      RELAY_CLAIM_LEASE: ${RELAY_CLAIM_LEASE:-30s}
      RELAY_RETRY_INTERVAL: ${RELAY_RETRY_INTERVAL:-10s}
      RELAY_RETRY_BATCH_SIZE: ${RELAY_RETRY_BATCH_SIZE:-100}
      RELAY_SNAPSHOT_COUNT_CAP: ${RELAY_SNAPSHOT_COUNT_CAP:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    image: ${DOCKERHUB_USERNAME:-local}/messenger-notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_ADD_SOURCE: ${LOG_ADD_SOURCE:-false}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger}@postgres:5432/${POSTGRES_DB:-messenger}?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      NOTIFICATION_COALESCE_WINDOW: ${NOTIFICATION_COALESCE_WINDOW:-5s}
      METRICS_ADDR: ${NOTIFICATION_METRICS_ADDR:-:9095}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:-./.secrets/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
