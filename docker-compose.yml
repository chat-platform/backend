services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./shared/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  message-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: message-service
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  core-api:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: core-api
    environment:
      LISTEN_ADDR: :8081
      GRPC_ADDR: :50052
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      DEV_OTP_CODE: "000000"
      JWT_SECRET: local-development-secret-change-before-deployment-000000
      SESSION_TTL: 24h
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ws-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: ws-gateway
    environment:
      LISTEN_ADDR: :8080
      REDIS_ADDR: redis:6379
      MESSAGE_SERVICE_ADDR: message-service:50051
      CORE_API_GRPC_ADDR: core-api:50052
      NODE_ID: ws-1
      JWT_SECRET: local-development-secret-change-before-deployment-000000
    ports:
      - "8080:8080"
    depends_on:
      message-service:
        condition: service_started
      core-api:
        condition: service_started
      redis:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: relay
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      RELAY_POLL_INTERVAL: 250ms
      RELAY_BATCH_SIZE: 100
      RELAY_WORKERS: 2
      RELAY_CLAIM_LEASE: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
