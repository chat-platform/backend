services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./shared/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./shared/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1 && mc ready local; do sleep 1; done &&
      mc mb --ignore-existing local/$${MEDIA_S3_BUCKET} &&
      mc cors set local/$${MEDIA_S3_BUCKET} /config/cors.json
    environment:
      MINIO_ROOT_USER: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MEDIA_S3_SECRET_KEY:-minioadmin}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-chat-media}
    volumes:
      - ./config/minio-cors.json:/config/cors.json:ro

  message-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: message-service
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      METRICS_ADDR: :9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      message-service:
        condition: service_started
      relay:
        condition: service_started
      ws-gateway:
        condition: service_started
      notification-service:
        condition: service_started
      core-api:
        condition: service_started

  core-api:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: core-api
    environment:
      LISTEN_ADDR: :8081
      GRPC_ADDR: :50052
      METRICS_ADDR: :9091
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      DEV_OTP_CODE: "000000"
      JWT_SECRET: local-development-secret-change-before-deployment-000000
      SESSION_TTL: 24h
      MEDIA_URL_TTL: ${MEDIA_URL_TTL:-5m}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-chat-media}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-minioadmin}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-minioadmin}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  ws-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: ws-gateway
    environment:
      LISTEN_ADDR: :8080
      REDIS_ADDR: redis:6379
      MESSAGE_SERVICE_ADDR: message-service:50051
      CORE_API_GRPC_ADDR: core-api:50052
      NODE_ID: ws-1
      METRICS_ADDR: :9094
      JWT_SECRET: local-development-secret-change-before-deployment-000000
    ports:
      - "8080:8080"
    depends_on:
      message-service:
        condition: service_started
      core-api:
        condition: service_started
      redis:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: relay
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      RELAY_POLL_INTERVAL: 250ms
      METRICS_ADDR: :9093
      RELAY_BATCH_SIZE: 100
      RELAY_WORKERS: 2
      RELAY_CLAIM_LEASE: 30s
      RELAY_SNAPSHOT_COUNT_CAP: ${RELAY_SNAPSHOT_COUNT_CAP:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: notification-service
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      NOTIFICATION_COALESCE_WINDOW: 5s
      METRICS_ADDR: :9095
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?Set GOOGLE_APPLICATION_CREDENTIALS to the Firebase service-account JSON file path}:/run/secrets/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
