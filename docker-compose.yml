services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: messenger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 2s
      timeout: 5s
      retries: 20

  migration-baseline:
    image: postgres:16-alpine
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql \"$${POSTGRES_DSN}\" -v ON_ERROR_STOP=1 -f /scripts/migration-baseline.sql"]
    volumes:
      - ./scripts/migration-baseline.sql:/scripts/migration-baseline.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable"
      - up
    volumes:
      - ./shared/migrations:/migrations:ro
    depends_on:
      migration-baseline:
        condition: service_completed_successfully

  seed:
    image: postgres:16-alpine
    profiles: ["manual"]
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
    entrypoint: ["psql"]
    command:
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/seeds/000001_dev.sql"
      - "postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable"
    volumes:
      - ./shared/seeds:/seeds:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  message-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: message-service
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ws-gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: ws-gateway
    environment:
      LISTEN_ADDR: :8080
      REDIS_ADDR: redis:6379
      MESSAGE_SERVICE_ADDR: message-service:50051
      NODE_ID: ws-1
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      message-service:
        condition: service_started
      redis:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: relay
    environment:
      POSTGRES_DSN: postgres://messenger:messenger@postgres:5432/messenger?sslmode=disable
      REDIS_ADDR: redis:6379
      RELAY_POLL_INTERVAL: 250ms
      RELAY_BATCH_SIZE: 100
      RELAY_WORKERS: 2
      RELAY_CLAIM_LEASE: 30s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
