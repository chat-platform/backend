syntax = "proto3";

package message.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/chat-platform/backend/shared/gen/message/v1;messagev1";

// MessageService is the durability boundary for sends.
// WS Gateway calls this; it does not deliver to recipients.
service MessageService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageAck);
  rpc MarkDelivered(MarkDeliveredRequest) returns (MarkDeliveredResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc MarkPlayed(MarkPlayedRequest) returns (MarkPlayedResponse);
}

message SendMessageRequest {
  string sender_id = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string device_id = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string chat_id = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  // Client-generated UUIDv7 used as the sender-scoped idempotency key.
  string client_msg_id = 4 [(buf.validate.field).string = {
    uuid: true
    pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-7[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  }];
  string content = 5 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
}

message SendMessageAck {
  string client_msg_id = 1;
  int64 ts_unix_milli = 2;
}

message MarkDeliveredRequest {
  string device_id = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  reserved 2, 3;
  string chat_id = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string message_sender_id = 5 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string client_msg_id = 6 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  int64 outbox_id = 7 [(buf.validate.field).int64.gt = 0];
  string outbox_type = 8 [(buf.validate.field).string = {pattern: "^(direct|group)$"}];
  string receipt_sender_id = 9 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
}

message MarkDeliveredResponse {}

message MarkReadRequest {
  string device_id = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string chat_id = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string message_sender_id = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string client_msg_id = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  reserved 5, 6, 7;
  string receipt_sender_id = 8 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
}

message MarkReadResponse {}

message MarkPlayedRequest {
  string device_id = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string chat_id = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string message_sender_id = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string client_msg_id = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
  string receipt_sender_id = 5 [(buf.validate.field).string = {
    min_len: 1
    pattern: ".*\\S.*"
  }];
}

message MarkPlayedResponse {}
