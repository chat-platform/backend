syntax = "proto3";

package message.v1;

option go_package = "github.com/chat-platform/backend/shared/gen/message/v1;messagev1";

// MessageService is the durability boundary for sends.
// WS Gateway calls this; it does not deliver to recipients.
service MessageService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageAck);
}

message SendMessageRequest {
  string sender_id = 1;
  string originating_device_id = 2;
  string chat_id = 3;
  string client_msg_id = 4;
  string content = 5;
}

message SendMessageAck {
  string client_msg_id = 1;
  int64 ts_unix_milli = 2;
}
