syntax = "proto3";

package session.v1;

option go_package = "github.com/chat-platform/backend/shared/gen/session/v1;sessionv1";

service SessionService {
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc CheckPresenceAccess(CheckPresenceAccessRequest) returns (CheckPresenceAccessResponse);
  rpc GetLastSeen(GetLastSeenRequest) returns (GetLastSeenResponse);
  rpc UpdateLastSeen(UpdateLastSeenRequest) returns (UpdateLastSeenResponse);
}

message ValidateSessionRequest {}

message ValidateSessionResponse {
  string session_id = 1;
  string user_id = 2;
  string device_id = 3;
  int64 issued_at = 4;
  int64 expires_at = 5;
}

message CheckPresenceAccessRequest {
  string target_user_id = 1;
}

message CheckPresenceAccessResponse {}

message GetLastSeenRequest {
  string target_user_id = 1;
}

message GetLastSeenResponse {
  bool has_last_seen = 1;
  int64 last_seen_unix_milli = 2;
}

// UpdateLastSeen is an internal Gateway-to-Core-API operation. It is
// idempotent and conditionally persists only timestamps newer than the value
// already stored for the user.
message UpdateLastSeenRequest {
  string user_id = 1;
  int64 last_seen_unix_milli = 2;
}

message UpdateLastSeenResponse {}
